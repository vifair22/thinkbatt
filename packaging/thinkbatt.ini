# thinkbatt configuration. Install at /etc/thinkbatt/thinkbatt.ini.
# Every key below shows its built-in default; delete a line to keep the default.
# A missing file is fine: the daemon uses the defaults.

# Resting charge band, percent. The pack charges up to band_stop and resumes
# only after falling below band_start. A narrow band near the middle is gentlest
# on the cells. band_start must be below band_stop.
band_start = 75
band_stop = 80

# Lowest state of charge a calibration discharges to. Kept above UPower's 2%
# hibernate action so the discharge never trips the OS low-battery handler.
# Range 5-50, and below band_start.
calib_floor = 7

# Run a calibration when either this many charge cycles have passed since the
# last, or this many days have, whichever comes first.
calib_every_cycles = 30
calib_every_days = 90

# Master switch for automatic calibration. Even when false, a manual
# `thinkbatt calibrate --now` still runs (where the hardware supports it).
calib_enabled = true

# Relaxation rests, minutes. A calibration holds the pack at rest
# (inhibit-charge, neither charging nor discharging on AC) at full and again at
# the floor, so the gauge can take the open-circuit-voltage readings it needs to
# relearn capacity. Without these the learned capacity does not update. Set 0 to
# skip a rest. Range 0-720.
rest_at_full_minutes = 60
rest_at_floor_minutes = 60

# Discharge rate for the force-discharge legs, as a fraction of design capacity
# per hour (0.2 = C/5). The daemon holds this rate with a controlled CPU load,
# reading the pack's power_now as feedback, so the discharge finishes in a
# bounded time regardless of the idle draw. Expressed as a C-rate so the same
# value gives the same relative stress on any ThinkPad. 0 disables the load and
# discharges at the idle draw, which then needs a much larger discharge timeout.
# Range 0-2.
discharge_c_rate = 0.2

# Per-phase timeouts, hours. A charge or discharge that does not complete in its
# window aborts the run (and restores the band). At discharge_c_rate 0.2 a deep
# discharge is ~5-6 h; raise discharge_timeout_hours well above 12 if you set
# discharge_c_rate = 0 (idle discharge).
charge_timeout_hours = 5
discharge_timeout_hours = 8

# System group allowed to use the control socket (the `thinkbatt` CLI). The
# daemon runs as root, so without this the socket is root-only and the CLI
# needs sudo. Set this to your login group to use the CLI as yourself. Empty
# leaves the socket world-accessible, which is fine on a single-user machine.
socket_group =

